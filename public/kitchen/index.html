<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Lobsteria Kitchen</title>
<style>
  :root {
    --bg: #111318;
    --panel: #1b1e26;
    --panel-alt: #22262f;
    --text: #f2f3f5;
    --muted: #9aa1ad;
    --accent: #e0a63e;
    --good: #4caf7d;
    --warn: #e0a63e;
    --bad: #d9534f;
    --border: #2d313c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }

  header { padding: 16px 20px 10px; border-bottom: 1px solid var(--border); }
  header h1 { margin: 0; font-size: 20px; }
  header .sub { margin-top: 2px; color: var(--muted); font-size: 13px; }

  nav { display: flex; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border); overflow-x: auto; }
  nav button { flex: 1; min-width: 90px; padding: 14px 10px; font-size: 15px; font-weight: 600;
    border: 1px solid var(--border); background: var(--panel); color: var(--muted); border-radius: 10px; }
  nav button.active { background: var(--accent); color: #1b1300; border-color: var(--accent); }

  main { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 60px; }
  .hidden { display: none !important; }

  .banner { background: var(--panel-alt); border: 1px solid var(--border); border-left: 4px solid var(--warn);
    border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; font-size: 13px; color: var(--muted); }

  .summary-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .stat { flex: 1; min-width: 120px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; text-align: center; }
  .stat .big { font-size: 22px; font-weight: 700; }
  .stat .label { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px;
    margin-bottom: 10px; display: flex; align-items: flex-start; gap: 12px; }
  .card.done { opacity: 0.45; }
  .card .checkbox { width: 28px; height: 28px; flex: none; border: 2px solid var(--muted); border-radius: 8px;
    margin-top: 2px; }
  .card.done .checkbox { background: var(--good); border-color: var(--good); }
  .card .body { flex: 1; }
  .card .title { font-size: 16px; font-weight: 600; }
  .card .meta { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .card .flag { display: inline-block; margin-top: 6px; font-size: 11px; color: var(--warn); border: 1px solid var(--warn);
    border-radius: 6px; padding: 2px 6px; }

  input[type="text"], input[type="number"] { width: 100%; padding: 12px; font-size: 16px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel-alt); color: var(--text); margin-bottom: 12px; }

  .recipe { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
  .recipe-head { padding: 14px; font-weight: 600; font-size: 16px; display: flex; justify-content: space-between; }
  .recipe-body { padding: 0 14px 14px; color: var(--muted); font-size: 14px; }
  .recipe-body img { max-width: 100%; border-radius: 8px; margin-bottom: 10px; }
  .recipe-body ul, .recipe-body ol { padding-left: 20px; margin: 6px 0; }

  .count-row { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .count-row .name { flex: 1; font-size: 14px; }
  .count-row input { width: 90px; margin: 0; text-align: center; }
  .count-row .unit { color: var(--muted); font-size: 12px; width: 60px; }

  .save-bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px; background: var(--bg);
    border-top: 1px solid var(--border); }
  .save-bar button { width: 100%; padding: 16px; font-size: 16px; font-weight: 700; border-radius: 10px;
    border: none; background: var(--accent); color: #1b1300; }

  .empty { color: var(--muted); text-align: center; padding: 30px 10px; font-size: 14px; }
  section.tab { padding-bottom: 70px; }
</style>
</head>
<body>

<header>
  <h1>Lobsteria &mdash; Kitchen</h1>
  <div class="sub" id="dateLabel"></div>
</header>

<nav>
  <button data-tab="prep" class="active">Today's Prep</button>
  <button data-tab="recipes">Recipes</button>
  <button data-tab="cleaning">Cleaning</button>
  <button data-tab="count">Count</button>
</nav>

<main>

  <section class="tab" id="tab-prep">
    <div id="prepBanner"></div>
    <div class="summary-row" id="prepSummary"></div>
    <div id="prepList"></div>
  </section>

  <section class="tab hidden" id="tab-recipes">
    <input type="text" id="recipeSearch" placeholder="Search a recipe by name or type..." />
    <div id="recipeList"></div>
  </section>

  <section class="tab hidden" id="tab-cleaning">
    <div id="cleaningList"></div>
  </section>

  <section class="tab hidden" id="tab-count">
    <div class="banner">Enter what's on hand right now for each item. Saving updates tomorrow's prep list automatically.</div>
    <div id="countList"></div>
    <div class="save-bar"><button id="saveCountsBtn">Save counts</button></div>
  </section>

</main>

<script>
(function () {
  const API_KEY = new URLSearchParams(window.location.search).get('api_key') || '';

  function withKey(url) {
    const u = new URL(url, window.location.origin);
    if (API_KEY) u.searchParams.set('api_key', API_KEY);
    return u.toString();
  }

  async function api(path, opts) {
    const res = await fetch(withKey(path), {
      ...opts,
      headers: { 'Content-Type': 'application/json', ...(opts && opts.headers) },
    });
    if (!res.ok) throw new Error('Request failed: ' + res.status);
    return res.json();
  }

  function todayKey() {
    return new Date().toISOString().split('T')[0];
  }

  function checkedState(storeKey, id) {
    try {
      const raw = localStorage.getItem(storeKey);
      const map = raw ? JSON.parse(raw) : {};
      return !!map[id];
    } catch { return false; }
  }

  function toggleChecked(storeKey, id) {
    try {
      const raw = localStorage.getItem(storeKey);
      const map = raw ? JSON.parse(raw) : {};
      map[id] = !map[id];
      localStorage.setItem(storeKey, JSON.stringify(map));
      return map[id];
    } catch { return false; }
  }

  // ---- Tabs ----
  const tabs = document.querySelectorAll('nav button');
  tabs.forEach((btn) => {
    btn.addEventListener('click', () => {
      tabs.forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('section.tab').forEach((s) => s.classList.add('hidden'));
      document.getElementById('tab-' + btn.dataset.tab).classList.remove('hidden');
    });
  });

  document.getElementById('dateLabel').textContent = new Date().toLocaleDateString(undefined, {
    weekday: 'long', month: 'long', day: 'numeric',
  });

  // ---- Today's Prep ----
  async function loadPrep() {
    const banner = document.getElementById('prepBanner');
    const summary = document.getElementById('prepSummary');
    const list = document.getElementById('prepList');
    banner.innerHTML = '';
    summary.innerHTML = '';
    list.innerHTML = '<div class="empty">Loading...</div>';

    let plan;
    try {
      plan = await api('/api/shift/prep-today');
    } catch (e) {
      list.innerHTML = '<div class="empty">Could not load prep list.</div>';
      return;
    }

    if (plan.incomplete) {
      banner.innerHTML = '<div class="banner">Some items are missing a par level or time estimate, so the time budget below may be incomplete. Ask the manager to fill those in on the Line Prep sheet.</div>';
    }

    summary.innerHTML = `
      <div class="stat"><div class="big">${plan.items.length}</div><div class="label">items to prep</div></div>
      <div class="stat"><div class="big">${plan.totalMinutes || '?'}</div><div class="label">minutes budgeted</div></div>
      <div class="stat"><div class="big">${plan.suggestedStartTime}</div><div class="label">start prep by</div></div>
    `;

    if (plan.items.length === 0) {
      list.innerHTML = '<div class="empty">Nothing short vs. par right now &mdash; or no counts entered yet. Check the Count tab.</div>';
      return;
    }

    const storeKey = 'prepDone:' + todayKey();
    list.innerHTML = '';
    plan.items.forEach((item) => {
      const done = checkedState(storeKey, item.id);
      const card = document.createElement('div');
      card.className = 'card' + (done ? ' done' : '');
      card.innerHTML = `
        <div class="checkbox"></div>
        <div class="body">
          <div class="title">${item.name}</div>
          <div class="meta">Need ${item.gap} ${item.unit} ${item.minutesNeeded != null ? '&middot; ~' + item.minutesNeeded + ' min' : ''} ${item.storage ? '&middot; ' + item.storage : ''}</div>
          ${item.needsReview ? '<div class="flag">needs par/time review</div>' : ''}
        </div>
      `;
      card.addEventListener('click', () => {
        const nowDone = toggleChecked(storeKey, item.id);
        card.classList.toggle('done', nowDone);
      });
      list.appendChild(card);
    });
  }

  // ---- Recipes ----
  async function loadRecipes(query) {
    const list = document.getElementById('recipeList');
    list.innerHTML = '<div class="empty">Loading...</div>';
    let data;
    try {
      data = await api('/api/recipes' + (query ? '?q=' + encodeURIComponent(query) : ''));
    } catch (e) {
      list.innerHTML = '<div class="empty">Could not load recipes.</div>';
      return;
    }
    const recipes = data.recipes || [];
    if (recipes.length === 0) {
      list.innerHTML = '<div class="empty">No recipes found.</div>';
      return;
    }
    list.innerHTML = '';
    recipes.forEach((r) => {
      const el = document.createElement('div');
      el.className = 'recipe';
      el.innerHTML = `
        <div class="recipe-head">${r.name}<span style="color:var(--muted); font-weight:400;">${r.type || ''}</span></div>
        <div class="recipe-body hidden">
          ${r.photo ? `<img src="${r.photo}" alt="${r.name}" />` : ''}
          ${r.ingredients ? '<strong>Ingredients</strong><ul>' + r.ingredients.map((i) => '<li>' + i + '</li>').join('') + '</ul>' : ''}
          ${r.instructions ? '<strong>Steps</strong><ol>' + r.instructions.map((s) => '<li>' + s + '</li>').join('') + '</ol>' : ''}
        </div>
      `;
      el.querySelector('.recipe-head').addEventListener('click', () => {
        el.querySelector('.recipe-body').classList.toggle('hidden');
      });
      list.appendChild(el);
    });
  }

  let searchTimer;
  document.getElementById('recipeSearch').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => loadRecipes(e.target.value), 200);
  });

  // ---- Cleaning ----
  async function loadCleaning() {
    const list = document.getElementById('cleaningList');
    list.innerHTML = '<div class="empty">Loading...</div>';
    let data;
    try {
      data = await api('/api/shift/cleaning-today');
    } catch (e) {
      list.innerHTML = '<div class="empty">Could not load cleaning tasks.</div>';
      return;
    }
    const tasks = data.tasks || [];
    if (tasks.length === 0) {
      list.innerHTML = '<div class="empty">Nothing due today.</div>';
      return;
    }
    const storeKey = 'cleaningDone:' + todayKey();
    list.innerHTML = '';
    tasks.forEach((t) => {
      const done = checkedState(storeKey, t.id);
      const card = document.createElement('div');
      card.className = 'card' + (done ? ' done' : '');
      card.innerHTML = `
        <div class="checkbox"></div>
        <div class="body">
          <div class="title">${t.name}</div>
          <div class="meta">${t.frequency}${t.area ? ' &middot; ' + t.area : ''} ${t.estimatedMinutes ? '&middot; ~' + t.estimatedMinutes + ' min' : ''}</div>
          ${t.procedure ? '<div class="meta">' + t.procedure + '</div>' : ''}
          ${t.needsReview ? '<div class="flag">sample task &mdash; confirm with manager</div>' : ''}
        </div>
      `;
      card.addEventListener('click', () => {
        const nowDone = toggleChecked(storeKey, t.id);
        card.classList.toggle('done', nowDone);
      });
      list.appendChild(card);
    });
  }

  // ---- Count ----
  async function loadCount() {
    const list = document.getElementById('countList');
    list.innerHTML = '<div class="empty">Loading...</div>';
    let data;
    try {
      data = await api('/api/line-prep');
    } catch (e) {
      list.innerHTML = '<div class="empty">Could not load the item list.</div>';
      return;
    }
    const items = data.items || [];
    list.innerHTML = '';
    items.forEach((item) => {
      const row = document.createElement('div');
      row.className = 'count-row';
      row.innerHTML = `
        <div class="name">${item.name}</div>
        <input type="number" min="0" step="any" data-id="${item.id}" placeholder="0" />
        <div class="unit">${item.unit || ''}</div>
      `;
      list.appendChild(row);
    });
  }

  document.getElementById('saveCountsBtn').addEventListener('click', async () => {
    const inputs = document.querySelectorAll('#countList input[data-id]');
    const entries = [];
    inputs.forEach((inp) => {
      if (inp.value !== '') entries.push({ itemId: inp.dataset.id, qty: parseFloat(inp.value) });
    });
    if (entries.length === 0) return;
    const btn = document.getElementById('saveCountsBtn');
    btn.textContent = 'Saving...';
    try {
      for (const entry of entries) {
        await api('/api/inventory/count', { method: 'POST', body: JSON.stringify(entry) });
      }
      btn.textContent = 'Saved ✓';
      setTimeout(() => (btn.textContent = 'Save counts'), 1500);
    } catch (e) {
      btn.textContent = 'Error saving — try again';
    }
  });

  // ---- Init ----
  loadPrep();
  loadRecipes('');
  loadCleaning();
  loadCount();
})();
</script>

</body>
</html>
